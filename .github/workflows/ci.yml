name: Smart System CI

on:
  push:
      branches:
              - main

pull_request:
         branches:
                - main

jobs:
    test-and-build:
         runs-on: ubuntu-latest
         steps:
              - name: Checkout repository
                uses: actions/checkout@v4 
              - name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                      node-version: 20
                      cache: npm 
              - name: Install dependencies
                uses: npm ci
              - name: Run lint
                uses: npm run lint
              - name: Run tests
                uses: npm test
              - name: Build Next.js application
                uses: npm run build